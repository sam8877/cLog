name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install dependencies
        working-directory: code
        run: npm ci

      - name: Install Playwright browser
        working-directory: code
        run: npx playwright install --with-deps chromium

      - name: Type check
        working-directory: code
        run: npx tsc --noEmit

      - name: Start dev server
        working-directory: code
        run: |
          npx wrangler dev --local --port 8787 --var DEMO_SEED:1 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8787/ > /dev/null

      - name: API integration tests
        working-directory: code
        run: npm run test:api

      - name: UI tests
        working-directory: code
        run: npx playwright test

      - name: Verify production-mode seed (base data, no DEMO_SEED)
        working-directory: code
        run: |
          npx wrangler dev --local --port 8788 --persist-to .wrangler/prod-check > /tmp/wrangler-prod.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8788/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8788/ > /dev/null
          # 生产模式验证逻辑在测试代码中: test/prod-seed.check.js
          node test/prod-seed.check.js http://localhost:8788
