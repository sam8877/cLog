<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>搜索 · 静思录</title>
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --surface-warm: var(--surface);
      --fg: #171717; --fg-2: #4d4d4d; --muted: #666666; --meta: #808080;
      --border: rgba(0, 0, 0, 0.08); --border-soft: rgba(0, 0, 0, 0.04);
      --accent: #0070f3; --accent-on: #ffffff;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --accent-hover: color-mix(in oklch, var(--accent) 88%, black);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --font-display: "Geist", "Geist Sans", -apple-system, "Segoe UI", Arial, sans-serif;
      --font-body: "Geist", "Geist Sans", -apple-system, "Segoe UI", Arial, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Monaco, monospace;
      --fs-h1: clamp(32px, 3.5vw, 48px); --fs-h2: clamp(22px, 2vw, 30px);
      --fs-lead: 19px; --fs-body: 16px; --fs-sm: 14px; --fs-meta: 13px;
      --gap-xs: 8px; --gap-sm: 12px; --gap-md: 20px; --gap-lg: 32px; --gap-xl: 56px; --gap-2xl: 96px;
      --container: 800px; --gutter: 24px;
      --radius: 8px; --radius-lg: 12px;
      --elev-raised: 0 0 0 1px rgba(0,0,0,0.08), 0 2px 2px rgba(0,0,0,0.04), 0 8px 8px -8px rgba(0,0,0,0.04), 0 0 0 1px #fafafa;
      --motion-fast: 150ms; --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    }
    [data-theme="dark"] {
      --bg: #0a0a0a; --surface: #171717; --surface-warm: #171717;
      --fg: #fafafa; --fg-2: #a1a1a1; --muted: #a1a1a1; --meta: #808080;
      --border: rgba(255, 255, 255, 0.08); --border-soft: rgba(255, 255, 255, 0.04);
      --accent: #3399ff; --accent-on: #0a0a0a;
      --accent-soft: color-mix(in oklch, var(--accent) 18%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 8%, transparent);
      --elev-raised: 0 0 0 1px rgba(255,255,255,0.08), 0 2px 2px rgba(0,0,0,0.2), 0 8px 8px -8px rgba(0,0,0,0.2), 0 0 0 1px #1a1a1a;
    }
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:var(--fs-body);line-height:1.6;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
    img,svg{display:block;max-width:100%}
    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer;border:0;background:none}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    p{text-wrap:pretty}h1,h2,h3{text-wrap:balance}
    .container{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter)}
    h1{font-family:var(--font-display);font-size:var(--fs-h1);line-height:1.12;letter-spacing:-0.02em;margin:0}
    h3{font-family:var(--font-display);font-size:19px;font-weight:500;line-height:1.3;margin:0}
    .lead{font-size:var(--fs-lead);line-height:1.55;color:var(--muted);max-width:40ch;margin:0}
    .meta{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--meta)}
    .tag{display:inline-flex;padding:2px 8px;border:1px solid var(--border);border-radius:999px;font-size:11px;color:var(--muted)}
    mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 2px}

    .topnav{position:sticky;top:0;z-index:10;background:color-mix(in oklch,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .topnav-inner{display:flex;align-items:center;justify-content:space-between;padding-block:14px}
    .topnav .logo{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
    .topnav .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    .topnav nav{display:flex;gap:var(--gap-lg);align-items:center}
    .topnav nav a{font-size:14px;color:var(--muted);transition:color var(--motion-fast)}
    .topnav nav a:hover,.topnav nav a.active{color:var(--fg)}
    .topnav nav a.admin-link{color:var(--accent)}
    .topnav nav a.admin-link:hover{color:var(--fg)}
    .theme-toggle{width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius);border:1px solid var(--border);color:var(--muted);font-size:16px;transition:all var(--motion-fast)}
    .theme-toggle:hover{color:var(--fg);border-color:var(--fg)}
    .hamburger{display:none;width:36px;height:36px;place-items:center;border-radius:var(--radius);border:1px solid var(--border);color:var(--fg);font-size:18px}
    @media(max-width:700px){.topnav nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:var(--gap-md);gap:var(--gap-sm)}.topnav nav.open{display:flex}.hamburger{display:grid}}

    .search-hero{padding:clamp(36px,5vw,64px) 0 var(--gap-md)}
    .search-box{display:flex;border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color var(--motion-fast);max-width:640px;margin:var(--gap-md) auto 0}
    .search-box:focus-within{border-color:var(--accent)}
    .search-box input{flex:1;border:0;padding:14px 20px;font:inherit;font-size:17px;background:var(--surface);color:var(--fg);outline:2px solid transparent}.search-box input:focus-visible{outline-color:var(--accent)}
    .search-box input::placeholder{color:var(--meta)}
    .search-box button{padding:14px 20px;background:var(--accent);color:var(--accent-on);font-size:18px;transition:background var(--motion-fast)}
    .search-box button:hover{background:var(--accent-hover)}

    .results-count{text-align:center;color:var(--meta);font-size:var(--fs-sm);margin-bottom:var(--gap-lg)}

    .result-row{display:block;padding:18px 20px;border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:var(--gap-sm);background:var(--surface);transition:box-shadow var(--motion-fast)}
    .result-row:hover{box-shadow:var(--elev-raised)}
    .result-row h3{font-size:18px;margin-bottom:4px}
    .result-row h3 mark{font-weight:600}
    .result-row .excerpt{margin:4px 0 8px;color:var(--muted);font-size:var(--fs-sm);line-height:1.55}
    .result-row .result-meta{display:flex;gap:var(--gap-sm);align-items:center;flex-wrap:wrap}
    .result-row .result-meta .date{font-family:var(--font-mono);font-size:var(--fs-meta);color:var(--meta)}

    .empty-state{text-align:center;padding:var(--gap-2xl) var(--gap-md);color:var(--meta)}
    .empty-state .empty-icon{font-size:48px;margin-bottom:var(--gap-md);opacity:0.4}

    .pagefoot{padding-block:var(--gap-xl);color:var(--muted);font-size:13px;border-top:1px solid var(--border);text-align:center}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <header class="topnav">
    <div class="container topnav-inner">
      <a href="blog-home.html" class="logo"><span class="logo-dot"></span>静思录</a>
      <button class="hamburger" id="hamburger" aria-label="菜单">☰</button>
      <nav id="mainNav">
        <a href="blog-home.html">首页</a>
        <a href="blog-archive.html">归档</a>
        <a href="blog-search.html" class="active">搜索</a>
        <a href="blog-page.html">关于</a>
        <a href="login.html" style="color:var(--muted);">登录</a>
        <a href="admin.html" class="admin-link">管理</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="切换暗色模式">◐</button>
    </div>
  </header>

  <main id="content">
    <section class="search-hero container" data-od-id="search-hero" style="text-align:center;">
      <h1>搜索文章</h1>
      <form class="search-box" onsubmit="return false;">
        <input type="search" id="searchInput" placeholder="输入关键词搜索…" autofocus autocomplete="off" />
        <button type="submit" aria-label="搜索">⌕</button>
      </form>
    </section>

    <section class="container" data-od-id="search-results" style="padding-bottom:var(--gap-2xl);">
      <p class="results-count" id="resultsCount"></p>
      <div id="resultsList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">⌕</div>
        <p>没有找到匹配的文章</p>
        <p style="font-size:var(--fs-sm);margin-top:4px;">试试其他关键词，或浏览 <a href="blog-archive.html" style="color:var(--accent);">标签归档</a></p>
      </div>
    </section>
  </main>

  <footer class="pagefoot">
    <div class="container">
      <span>© 静思录 · 2026</span>
      <span class="meta" style="margin-left:12px;">← <a href="blog-home.html" style="color:var(--accent);">返回首页</a></span>
    </div>
  </footer>

  <script>
    const articles=[
      {title:'构建一个个人知识管理系统：从笔记到洞见',date:'2026-07-20',excerpt:'笔记工具泛滥的时代，关键在于方法而非工具。本文梳理了一套轻量级知识管理流程，从碎片捕捉到定期回顾，不需要任何付费软件。',tags:'知识管理,效率,工具'},
      {title:'CSS Container Queries 实战：告别全局断点思维',date:'2026-07-15',excerpt:'Container Queries 已经可以在生产环境使用。通过三个真实组件案例，展示如何从全局媒体查询迁移到组件级响应式设计。',tags:'CSS,前端'},
      {title:'Rust 中的异步运行时：tokio 核心概念拆解',date:'2026-07-08',excerpt:'从 Future trait 到 task 调度，理解 tokio 的设计决策如何影响你写的每一行 async 代码。附可运行的迷你运行时实现。',tags:'Rust,异步编程'},
      {title:'从零设计一个博客系统：架构决策记录',date:'2026-06-28',excerpt:'为什么选择 SSG 而不是 SSR？评论系统自建还是接入？标签和分类的数据模型如何设计？记录每一个关键取舍。',tags:'架构,系统设计'},
      {title:'TypeScript 5.6 新特性速览：迭代器辅助方法来了',date:'2026-06-20',excerpt:'Iterator.prototype 上的 map/filter/take 等方法正式进入 TypeScript。看看它们如何简化数据管道，以及和数组链式调用的性能对比。',tags:'TypeScript,JavaScript'},
      {title:'为什么你应该写"差"的初稿',date:'2026-06-12',excerpt:'完美主义是写作最大的敌人。这篇文章论证了先写完再修改的认知科学依据，以及如何训练自己接受不完美的第一稿。',tags:'写作,创造力'},
    ];

    function highlight(text,q){
      if(!q)return text;
      const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi');
      return text.replace(re,'<mark>$1</mark>');
    }

    function doSearch(){
      const q=document.getElementById('searchInput').value.trim().toLowerCase();
      const results=q?articles.filter(a=>
        a.title.toLowerCase().includes(q)||a.excerpt.toLowerCase().includes(q)||a.tags.toLowerCase().includes(q)
      ):articles;
      document.getElementById('resultsCount').textContent=q?`找到 ${results.length} 篇相关文章`:'全部文章';
      document.getElementById('emptyState').style.display=results.length?'none':'block';
      document.getElementById('resultsList').innerHTML=results.map(a=>`<a href="blog-post.html" class="result-row">
        <h3>${highlight(a.title,q)}</h3>
        <p class="excerpt">${highlight(a.excerpt,q)}</p>
        <div class="result-meta"><span class="date">${a.date}</span>${a.tags.split(',').map(t=>'<span class="tag">'+t+'</span>').join('')}</div>
      </a>`).join('');
    }

    document.getElementById('searchInput').addEventListener('input',doSearch);
    doSearch();

    // Theme
    const html=document.documentElement,toggle=document.getElementById('themeToggle');
    const stored=localStorage.getItem('blog-theme');
    if(stored)html.setAttribute('data-theme',stored);
    else if(window.matchMedia('(prefers-color-scheme:dark)').matches)html.setAttribute('data-theme','dark');
    toggle.textContent=html.getAttribute('data-theme')==='dark'?'◑':'◐';
    toggle.addEventListener('click',()=>{const n=html.getAttribute('data-theme')==='dark'?'light':'dark';html.setAttribute('data-theme',n);toggle.textContent=n==='dark'?'◑':'◐';localStorage.setItem('blog-theme',n)});
    const h=document.getElementById('hamburger'),nav=document.getElementById('mainNav');
    h.addEventListener('click',()=>{nav.classList.toggle('open');h.textContent=nav.classList.contains('open')?'✕':'☰'});
  </script>
</body>
</html>
