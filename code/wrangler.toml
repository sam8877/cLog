name = "jingsilu-blog"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# 生产部署不设置 DEMO_SEED — 仅初始化基础数据 (设置 + 分类), 密码默认 admin123
# (可通过 ADMIN_PASSWORD secret 覆盖, 登录后引导改密)
# 本地开发/测试: 需显式 --var DEMO_SEED:1 启用演示数据 (npm run dev 已内置)

[[d1_databases]]
binding = "DB"
database_name = "jingsilu-db"
database_id = "local-dev"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "jingsilu-media"

[observability]
enabled = true
